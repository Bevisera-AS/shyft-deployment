suite: helm tests
release:
  name: shyft-hydrology
  namespace: shyft
tests:
  - it: always ships the read-only connection test
    template: templates/tests/test-connection.yaml
    set:
      image:
        repository: registry.example.org/shyft
        tag: 1.2.3-4.5
    asserts:
      - isKind: {of: Pod}
      - equal: {path: metadata.name, value: shyft-hydrology-test-connection}
      - equal: {path: 'metadata.annotations["helm.sh/hook"]', value: test}
      - equal: {path: 'metadata.labels["app.kubernetes.io/component"]', value: test}
      - equal: {path: spec.restartPolicy, value: Never}
      - equal:
          path: spec.containers[0].image
          value: registry.example.org/shyft:1.2.3-4.5
      - contains:
          path: spec.containers[0].env
          content: {name: SHYFT_SERVICE_HOST, value: shyft-hydrology}
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: get_server_version

  - it: does not ship the model run by default, because it writes to the databases
    template: templates/tests/test-model-run.yaml
    asserts:
      - hasDocuments: {count: 0}

  - it: ships the model run on request, after the connection test, with a deadline
    template: templates/tests/test-model-run.yaml
    set:
      tests.modelRun.enabled: true
    asserts:
      - isKind: {of: Pod}
      - equal: {path: metadata.name, value: shyft-hydrology-test-model-run}
      - equal: {path: 'metadata.annotations["helm.sh/hook"]', value: test}
      - equal: {path: 'metadata.annotations["helm.sh/hook-weight"]', value: "1"}
      - equal: {path: spec.activeDeadlineSeconds, value: 300}
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: create_initial_content

  - it: refuses the model run without a drms, since it would wait forever
    template: templates/tests/test-model-run.yaml
    set:
      tests.modelRun.enabled: true
      drms.replicaCount: 0
    asserts:
      - failedTemplate:
          errorPattern: tests.modelRun.enabled needs drms.replicaCount of at least 1

  - it: schedules the test pods nowhere in particular by default
    templates:
      - templates/tests/test-connection.yaml
      - templates/tests/test-model-run.yaml
    set:
      tests.modelRun.enabled: true
    asserts:
      - notExists: {path: spec.nodeSelector}
      - notExists: {path: spec.tolerations}
      - notExists: {path: spec.affinity}

  # The image is amd64 only, and the workloads may sit on tainted nodes: the tests must be able to follow.
  - it: schedules both test pods like the workloads when told to
    templates:
      - templates/tests/test-connection.yaml
      - templates/tests/test-model-run.yaml
    set:
      tests:
        modelRun:
          enabled: true
        nodeSelector:
          kubernetes.io/arch: amd64
        tolerations:
          - {key: dedicated, operator: Exists}
        affinity:
          nodeAffinity: {}
    asserts:
      - equal: {path: spec.nodeSelector, value: {kubernetes.io/arch: amd64}}
      - equal: {path: spec.tolerations, value: [{key: dedicated, operator: Exists}]}
      - exists: {path: spec.affinity.nodeAffinity}

  - it: runs the connection test before the model run
    set:
      tests.modelRun.enabled: true
    asserts:
      - template: templates/tests/test-connection.yaml
        equal: {path: 'metadata.annotations["helm.sh/hook-weight"]', value: "0"}
      - template: templates/tests/test-model-run.yaml
        equal: {path: 'metadata.annotations["helm.sh/hook-weight"]', value: "1"}
      - template: templates/tests/test-connection.yaml
        notExists: {path: spec.activeDeadlineSeconds}

  - it: sizes both test pods, with a memory limit and no CPU limit
    templates:
      - templates/tests/test-connection.yaml
      - templates/tests/test-model-run.yaml
    set:
      tests.modelRun.enabled: true
    asserts:
      - equal:
          path: spec.containers[0].resources
          value:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}

  - it: takes the test pods' resources from values
    template: templates/tests/test-connection.yaml
    set:
      tests.resources:
        limits: {cpu: "1", memory: 1Gi}
    asserts:
      - equal:
          path: spec.containers[0].resources.limits
          value: {cpu: "1", memory: 1Gi}

  - it: refuses a test pod memory request above its limit
    template: templates/tests/test-connection.yaml
    set:
      tests.resources.requests.memory: 1Gi
    asserts:
      - failedTemplate:
          errorPattern: "tests.resources: the memory request 1Gi is above the memory limit 512Mi"
