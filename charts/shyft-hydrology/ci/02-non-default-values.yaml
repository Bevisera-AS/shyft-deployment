# Everything that is not a default and needs no more than a values file, in one install:
# - Two drms, one per kind worker, so registration with task and the statistics path to dtss cross nodes.
# - Sigma2's base port.
# - A Service named "shyft": without enableServiceLinks=false Kubernetes would inject
#   SHYFT_SERVICE_HOST=<cluster IP> into every pod, and Shyft reads that variable.
# - Another uid and gid than the image's, as on storage that ignores fsGroup (NIRD).
# - Memory limits, extra env and pod labels.
# Restricted clients are in hack/networkpolicy-test.sh, which also checks that the others are refused.
fullnameOverride: shyft
shyft:
  basePort: 22000
podSecurityContext:
  runAsUser: 2000
  runAsGroup: 2000
  fsGroup: 2000
drms:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  extraEnv:
    - name: TZ
      value: UTC
core:
  resources:
    dtss:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
  extraEnv:
    - name: TZ
      value: UTC
  podLabels:
    team: hydrology
tests:
  modelRun:
    enabled: true
