# Locked down: only labelled pods are clients, limits on every container, extra env and labels.
# hack/networkpolicy-test.sh checks that the other pods are really refused.
networkPolicy:
  allowNamespace: false
  clientPeers:
    - podSelector:
        matchLabels:
          shyft-client: "true"
core:
  resources:
    dtss:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
  extraEnv:
    - name: TZ
      value: UTC
  podLabels:
    team: hydrology
drms:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  extraEnv:
    - name: TZ
      value: UTC
tests:
  modelRun:
    enabled: true
