name: Lint and test

# Everything here is a mise task, so it runs the same on a laptop: see mise.toml.

on:
  pull_request:  # no paths filter: the required checks must always report
  workflow_call:  # from release.yaml, on the master commit being released

permissions:
  contents: read

concurrency:
  group: lint-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c  # v5.2.6
        with:
          version: 2026.11.7
      - run: mise run lint-actions

  chart:
    name: Chart
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # ct compares with origin/master
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c  # v5.2.6
        with:
          version: 2026.11.7
      - name: README.md and values.schema.json are up to date
        run: mise run check-generated
      - run: mise run lint
      - name: Chart version bumped
        if: github.event_name == 'pull_request'
        run: mise run check-version
      - run: mise run unittest
      - run: mise run kubeconform

  kind:
    name: kind (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Pull requests: newest only, about 10 minutes. master, which release.yaml runs through here before
        # every release: oldest too. A failure only the oldest lane sees shows up after the merge.
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["newest"]' || '["newest", "oldest"]') }}
    env:
      # The oldest and newest node images in the kind v0.33.0 release notes. Bump together with kind in
      # mise.toml and KIND_NODE_IMAGE there. kubectl must be within one minor of the cluster.
      KIND_NODE_IMAGE: ${{ matrix.lane == 'oldest' && 'kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d' || 'kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5' }}
      MISE_KUBECTL_VERSION: ${{ matrix.lane == 'oldest' && '1.34.13' || '1.37.2' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # ct and hack/persistence-test.sh upgrade from the chart on origin/master
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c  # v5.2.6
        with:
          version: 2026.11.7
      - run: mise run kind-up
      - run: mise run load-image
      - run: mise run e2e
      - name: Diagnostics
        if: failure()
        run: mise run dump
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: dump-${{ matrix.lane }}
          path: .tmp/dump/
          retention-days: 7
